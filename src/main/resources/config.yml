# This config allows you to configure the things within the harvester hoe plugin.

# **Some things have been hard-coded**, so if you have no contact with the author about a change, then unfortunate.
# This plugin wasn't created to be sent around :P


# What permission node should the /harvesterhoes be under?
CommandPermission: 'harvesterhoes.admin'

# What message should get returned if a player has no permission?
PermissionMessage: '&cYou do not have permission to use this command.'

# What should be the display name of the harvester hoe?
HoeDisplayName: '&7[&bHarvester Hoe&7]'

# What should be the prefix before a player is sent a message?
PluginPrefix: '&7[&bHarvester Hoes&7]: '

# --------------------------------------------------------------
# ENCHANTMENT MODIFIERS BELOW.
# **ALL "MaxLevel" VALUES MUST BE BETWEEN 1 AND 1500 OR THE PLUGIN WILL DISABLE.**
# --------------------------------------------------------------

# ------------
# TOKEN MASTER
# ------------
# What should be the maximum level for token master?
TokenMasterMaxLevel: 10

# What should be the starting price (in tokens) to level up token master (0 to 1) ?
TokenMasterStartingPrice: 5000

# What should be the price multiplier per level for token master?
TokenMasterPriceMultiplier: 0.2

# What should be the token multiplier per level for token master?
TokenMasterTokenMultiplier: 0.25

# ---------------
# SPAWNER FINDER
# ---------------

# --------------------------------------------
# List all spawners, separating all spawner names with JUST commas, and having only lowercase letters.
# E.g. pig,enderman,zombie,iron_golem
# If this is left empty, the spawner finder enchant will be disabled.
SpawnerList: ''


# What should be the maximum level for spawner finder?
SpawnerFinderMaxLevel: 10

# What should be the starting price (in tokens) to level up spawner finder (0 to 1) ?
SpawnerFinderStartingPrice: 5000

# What should be the price multiplier per level for spawner finder?
SpawnerFinderPriceMultiplier: 0.3

# How much should we increase the % chance of rolling a spawner per cane per level?
SpawnerFinderChanceMultiplier: 0.1

# ---------------
# KEY FINDER
# ---------------

# --------------------------------------------
# List all keys, separating all keys with JUST commas, and having only lowercase letters.
# E.g. vote,lunar,solar,jupiter,mars
# If this is left empty, the key finder enchant will be disabled.
KeysList: ''



# What should be the maximum level for key finder?
KeyFinderMaxLevel: 10

# What should be the starting price (in tokens) to level up key finder (0 to 1)?
KeyFinderStartingPrice: 5000

# What should be the price multiplier per level for key finder?
KeyFinderPriceMultiplier: 0.3

# How much should we increase the % chance of rolling for a key per level?
KeyFinderChanceMultiplier: 0.1



# ---------------
# AUTO SELL
# ---------------

# What should be price to unlock auto-sell as an enchantment?
AutoSellPrice: 50000

# What should each sugar cane sell for?
SugarCaneSellPrice: 50